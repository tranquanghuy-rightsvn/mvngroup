<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found – MVN Group</title>
    <meta name="robots" content="noindex, follow">

    <link rel="icon" href="/favicon-32x32.png" sizes="32x32">
    <link rel="icon" href="/favicon-192x192.png" sizes="192x192">

    <style>
        /* Trang 404 duoc serve o bat ky path nao -> moi duong dan phai tuyet doi tu root */
        @font-face {
            font-family: 'Inter Tight';
            src: url('/fonts/InterTight-VariableFont_wght.ttf') format('truetype-variations');
            font-weight: 100 900;
            font-display: swap;
        }

        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('/fonts/Cormorant_Garamond-and-Inter_Tight/Cormorant_Garamond/CormorantGaramond-VariableFont_wght.ttf') format('truetype-variations');
            font-weight: 300 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('/fonts/Cormorant_Garamond-and-Inter_Tight/Cormorant_Garamond/CormorantGaramond-Italic-VariableFont_wght.ttf') format('truetype-variations');
            font-weight: 300 700;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'Helvetica W01 Light';
            src: url('/fonts/Helvetica%20W01%20Light/Web%20Fonts/e89eb1cff9eb261b0d77a4dea27f1ef1.woff2') format('woff2'),
                 url('/fonts/Helvetica%20W01%20Light/Web%20Fonts/e89eb1cff9eb261b0d77a4dea27f1ef1.woff') format('woff'),
                 url('/fonts/Helvetica%20W01%20Light/Web%20Fonts/e89eb1cff9eb261b0d77a4dea27f1ef1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        h1, h2 {
            font-family: 'Cormorant Garamond', serif;
            font-variant-numeric: lining-nums;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Helvetica W01 Light', 'Inter Tight', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #2c2c2c;
            text-align: center;
            padding: 24px;
        }

        .nf__logo img {
            width: 54px;
            height: auto;
            display: block;
            margin: 0 auto 40px;
        }

        .nf__code {
            margin: 0;
            font-size: clamp(96px, 16.8vw, 192px);
            font-weight: 200;
            letter-spacing: 6px;
            line-height: 0.65em;
            color: #8f8f8a;
        }

        .nf__title {
            margin: 20px 0 12px;
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 400;
        }

        .nf__text {
            margin: 0 0 36px;
            font-size: 16px;
            line-height: 1.7;
            color: #6f6f6b;
            max-width: 480px;
        }

        .nf__btn {
            display: inline-block;
            padding: 14px 36px;
            background: #e9a63c;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            letter-spacing: .5px;
            border-radius: 999px;
            transition: background .3s ease;
        }

        .nf__btn:hover {
            background: #2c2c2c;
        }

        .nf__links {
            margin-top: 28px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .nf__links a {
            color: #8a8a86;
            text-decoration: none;
            transition: color .3s ease;
        }

        .nf__links a:hover {
            color: #e9a63c;
        }
    </style>
</head>

<body>

    <a class="nf__logo" href="/" aria-label="MVN Group - Home">
        <img src="/images/logo.avif" alt="MVN Group">
    </a>

    <h1 class="nf__code">404</h1>
    <p class="nf__title">The page you requested was not found</p>
    <p class="nf__text">This page may have moved to a new address or no longer exists. Return to the homepage or explore the sections below.</p>

    <a class="nf__btn" href="/">Back to Home</a>

    <nav class="nf__links">
        <a href="/about-us/">About</a>
        <a href="/our-projects/">Projects</a>
        <a href="/news/">News</a>
        <a href="/about-us/#office-block">Contact</a>
    </nav>

</body>

</html>
